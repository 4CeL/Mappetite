<text x="551" y="557" font-size="13" font-weight="500" fill="#5B6B51" text-anchor="middle">Sudah dikunjungi</text>

<text x="664" y="522" font-size="12" font-weight="700" fill="#3F4A32">Kisaran harga</text>
<g font-size="13" text-anchor="middle">
<rect x="664" y="532" width="68" height="40" rx="10" fill="#fff" stroke="#E4E0D3"/><text x="698" y="557" fill="#5B6B51">$</text>
<rect x="740" y="532" width="68" height="40" rx="10" fill="#E7ECDF" stroke="#5D6C4B"/><text x="774" y="557" fill="#3F4A32" font-weight="700">$$</text>
<rect x="816" y="532" width="68" height="40" rx="10" fill="#fff" stroke="#E4E0D3"/><text x="850" y="557" fill="#5B6B51">$$$</text>
<rect x="892" y="532" width="68" height="40" rx="10" fill="#fff" stroke="#E4E0D3"/><text x="926" y="557" fill="#5B6B51">$$$$</text>
</g>

<text x="312" y="602" font-size="12" font-weight="700" fill="#3F4A32">Tag</text>
<g font-size="12">
<rect x="312" y="612" width="80" height="30" rx="15" fill="#F1EFE4"/><text x="326" y="631" fill="#3F4A32">Ramen  ×</text>
<rect x="400" y="612" width="86" height="30" rx="15" fill="#F1EFE4"/><text x="414" y="631" fill="#3F4A32">Jepang  ×</text>
<rect x="494" y="612" width="112" height="30" rx="15" fill="#fff" stroke="#D9D4C4" stroke-dasharray="4 3"/><text x="550" y="631" fill="#5B6B51" text-anchor="middle">+ Tambah tag</text>
<text x="622" y="631" fill="#5F6D54">Saran: Halal · Nugas · Date</text>
</g>

<text x="312" y="670" font-size="12" font-weight="700" fill="#3F4A32">Catatan <tspan font-weight="400" fill="#5F6D54">(opsional)</tspan></text>
<rect x="312" y="680" width="656" height="64" rx="10" fill="#fff" stroke="#E4E0D3"/>
<text x="328" y="706" font-size="14" fill="#293220">Rekomendasi dari Dina, wajib coba shoyu ramen-nya.</text>
<text x="956" y="734" font-size="11" fill="#5F6D54" text-anchor="end">50/500</text>

<rect x="280" y="764" width="720" height="1" fill="#E4E0D3"/>
<rect x="720" y="780" width="96" height="44" rx="10" fill="#fff" stroke="#D9D4C4"/>
<text x="768" y="807" font-size="14" font-weight="700" fill="#3F4A32" text-anchor="middle">Batal</text>
<rect x="828" y="780" width="140" height="44" rx="10" fill="#5D6C4B"/>
<text x="898" y="807" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Simpan Restoran</text>
</svg>
