<!-- Background page (dimmed) -->
<rect width="1280" height="900" fill="#FAF6EC"/>
<rect width="1280" height="72" fill="#fff"/>
<use href="#logoMark" x="24" y="14" width="44" height="46"/>
<text x="74" y="45" font-size="22" font-weight="800" fill="#293220" textLength="118" lengthAdjust="spacingAndGlyphs">Mappetite</text>
<path d="M179 30C182 24 188 21 194 22C192 28 186 32 179 30Z" fill="#5C6B4A"/>
<rect x="1000" y="18" width="184" height="36" rx="10" fill="#5D6C4B"/>
<rect x="24" y="110" width="320" height="26" rx="8" fill="#E4E0D3"/>
<rect x="24" y="172" width="420" height="48" rx="12" fill="#fff"/>
<rect x="24" y="336" width="420" height="116" rx="16" fill="#fff"/>
<rect x="24" y="464" width="420" height="116" rx="16" fill="#fff"/>
<rect x="24" y="592" width="420" height="116" rx="16" fill="#fff"/>
<rect x="24" y="720" width="420" height="116" rx="16" fill="#fff"/>
<g clip-path="url(#mapClip)"><use href="#tiles" x="468" y="96" width="788" height="780"/></g>
<rect width="1280" height="900" fill="#293220" opacity=".5"/>

<!-- Modal -->
<rect x="280" y="60" width="720" height="780" rx="20" fill="#fff" filter="url(#sh2)"/>
<text x="312" y="106" font-size="22" font-weight="700" fill="#293220">Tambah Restoran</text>
<text x="312" y="130" font-size="13" fill="#5F6D54">Tempel link Google Maps, nama dan lokasinya kami isi otomatis.</text>
<circle cx="956" cy="100" r="16" fill="#F1EFE4"/>
<path d="M950 94l12 12M962 94l-12 12" stroke="#5B6B51" stroke-width="2" stroke-linecap="round"/>
<rect x="280" y="152" width="720" height="1" fill="#E4E0D3"/>

<text x="312" y="182" font-size="12" font-weight="700" fill="#3F4A32">Link Google Maps</text>
<rect x="312" y="192" width="500" height="48" rx="12" fill="#fff" stroke="#5D6C4B" stroke-width="1.5"/>
<rect x="309" y="189" width="506" height="54" rx="15" fill="none" stroke="#5D6C4B" stroke-opacity=".18" stroke-width="3"/>
<g transform="translate(336 216)" fill="none" stroke="#5F6D54" stroke-width="2" stroke-linecap="round"><path d="M-3 3l6-6M-1-6l2-2a4 4 0 0 1 6 6l-2 2M1 6l-2 2a4 4 0 0 1-6-6l2-2"/></g>
<text x="356" y="221" font-size="14" fill="#293220">https://maps.app.goo.gl/x7Kp2QeR9vLm</text>
<rect x="824" y="192" width="144" height="48" rx="12" fill="#5D6C4B"/>
<text x="896" y="221" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ambil Data</text>

<circle cx="320" cy="262" r="8" fill="#D97745"/>
<path d="M316 262l3 3 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="336" y="266" font-size="13" font-weight="600" fill="#9A4A26">Nama dan lokasi berhasil diambil. Cek lagi sebelum disimpan.</text>

<!-- Mini map preview -->
<g clip-path="url(#miniClip)">
<use href="#tiles" x="312" y="284" width="260" height="190"/>
<ellipse cx="442" cy="392" rx="10" ry="4" fill="#293220" opacity=".18"/>
<use href="#pinB" transform="translate(442 390) scale(1.2)"/>
</g>
<rect x="312" y="284" width="260" height="190" rx="12" fill="none" stroke="#E4E0D3"/>
<text x="312" y="494" font-size="11.5" fill="#5F6D54">Lokasi kurang pas? Geser pin di peta.</text>

<text x="596" y="298" font-size="12" font-weight="700" fill="#3F4A32">Nama restoran</text>
<rect x="596" y="308" width="372" height="44" rx="10" fill="#fff" stroke="#E4E0D3"/>
<text x="612" y="335" font-size="14" fill="#293220">Ramen Hokkori</text>
<text x="596" y="376" font-size="12" font-weight="700" fill="#3F4A32">Alamat</text>
<rect x="596" y="386" width="372" height="44" rx="10" fill="#fff" stroke="#E4E0D3"/>
<text x="612" y="413" font-size="14" fill="#293220">Jl. Melawai Raya No. 12, Blok M, Jaksel</text>
<text x="596" y="450" font-size="11.5" fill="#5F6D54">Alamat otomatis dari OpenStreetMap, bisa diubah.</text>

<text x="312" y="522" font-size="12" font-weight="700" fill="#3F4A32">Status</text>
