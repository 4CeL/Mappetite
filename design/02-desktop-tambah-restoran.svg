<filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#293220" flood-opacity="0.08"/></filter>
<filter id="sh2" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#293220" flood-opacity="0.25"/></filter>
