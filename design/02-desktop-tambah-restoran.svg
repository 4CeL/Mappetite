<rect x="420" y="40" width="170" height="90" rx="10" fill="#D9EED8" transform="rotate(-8 505 85)"/>
<rect x="560" y="470" width="110" height="120" rx="10" fill="#D9EED8" transform="rotate(-8 615 530)"/>
<g transform="rotate(-8 400 350)" fill="none" stroke="#FFFFFF" stroke-width="5">
<path d="M-200 -24H1000M-200 40H1000M-200 104H1000M-200 168H1000M-200 232H1000M-200 296H1000M-200 360H1000M-200 424H1000M-200 488H1000M-200 552H1000M-200 616H1000M-200 680H1000M-200 744H1000"/>
<path d="M-52 -200V900M20 -200V900M92 -200V900M164 -200V900M236 -200V900M308 -200V900M380 -200V900M452 -200V900M524 -200V900M596 -200V900M668 -200V900M740 -200V900M812 -200V900"/>
</g>
<g fill="none" stroke-linecap="round">
