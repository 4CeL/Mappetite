</g>
<path d="M620 -10C600 80 650 170 820 190V-10Z" fill="#CFE3F5"/>
<path d="M-10 640C80 600 160 650 230 710H-10Z" fill="#CFE3F5"/>
</symbol>
<g id="pinB"><path d="M0 0C-4-10-16-18-16-28A16 16 0 1 1 16-28C16-18 4-10 0 0Z" fill="#5D6C4B" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-28" r="6" fill="#fff"/></g>
<clipPath id="mapClip"><rect x="468" y="96" width="788" height="780" rx="20"/></clipPath>
<clipPath id="miniClip"><rect x="312" y="284" width="260" height="190" rx="12"/></clipPath>
